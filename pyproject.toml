[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnisearch-ai"
version = "0.1.0"
description = "A student research project for AI-driven retrieval and search."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
vector = [
    "torch>=2.4",
    "sentence-transformers>=3.0",
    "chromadb>=1.0",
    "psutil>=5.9",
]
multimodal = [
    "torch>=2.4",
    "transformers>=4.44",
    "Pillow>=10.0",
    "easyocr>=1.7",
    "chromadb>=1.0",
]
generative = [
    "torch>=2.4",
    "transformers>=4.44",
    "sentencepiece>=0.2",
]
research = [
    "matplotlib>=3.8",
    "mlflow>=2.12",
]
app = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "streamlit>=1.40,<2.0",
    "requests>=2.32,<3.0",
    "pandas>=2.2,<3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnisearch_ai*"]
